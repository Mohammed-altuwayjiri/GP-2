name: Feedback analyzer CI/CD pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::166889922951:role/GitHub-ActionRole
          aws-region: eu-north-1

      - name: Verify AWS Login
        run: aws sts get-caller-identity

      - name: Install dependencies
        run: |
          mkdir package
          pip install -r requirements.txt -t package

      - name: Copy project files
        run: |
          cp lambda_function.py package/
          cp analysis.py package/
          cp -r models package/

      - name: Create deployment package
        run: |
          cd package
          zip -r ../lambda.zip .

      - name: Upload ZIP to S3
        run: |
          aws s3 cp lambda.zip s3://requirements-deploy/lambda.zip

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
          --function-name feedback-analyzer \
          --s3-bucket requirements-deploy \
          --s3-key lambda.zip
