name: Feedback analyzer CI/CD pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::166889922951:role/GitHub-ActionRole
          aws-region: eu-north-1

      - name: Verify AWS Login
        run: aws sts get-caller-identity

      - name: Check Lambda runtime
        run: |
          RUNTIME=$(aws lambda get-function-configuration \
            --function-name feedback-analyzer \
            --query Runtime \
            --output text)

          echo "Lambda runtime: $RUNTIME"

          if [ "$RUNTIME" != "python3.11" ]; then
            echo "::error::Lambda runtime is $RUNTIME. Expected python3.11."
            echo "Update the Lambda runtime before deploying."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          mkdir -p package

          python -m pip install \
            --no-cache-dir \
            --no-compile \
            -r requirements.txt \
            -t package

      - name: Optimize Lambda package
        run: |
          echo "Package size before cleanup:"
          du -sh package

          # Remove tests, benchmarks and caches
          find package -type d \( \
            -name tests -o \
            -name test -o \
            -name benchmarks -o \
            -name _pycache_ \
          \) -prune -exec rm -rf {} +

          # Remove compiled Python cache files
          find package -type f \( \
            -name '*.pyc' -o \
            -name '*.pyo' \
          \) -delete

          echo "Package size after cleanup:"
          du -sh package

      - name: Copy project files
        run: |
          cp lambda_function.py package/
          cp analysis.py package/
          cp -r models package/

      - name: Check final package size
        run: |
          PACKAGE_SIZE=$(du -sb package | cut -f1)
          MAX_SIZE=$((240 * 1024 * 1024))

          echo "Package size: $PACKAGE_SIZE bytes"
          echo "Maximum allowed by workflow: $MAX_SIZE bytes"

          if [ "$PACKAGE_SIZE" -ge "$MAX_SIZE" ]; then
            echo "::error::Lambda package is still too large."
            exit 1
          fi

          echo "Package size check passed."

      - name: Create deployment package
        run: |
          cd package
          zip -q -r ../lambda.zip .

      - name: Check ZIP size
        run: |
          du -sh lambda.zip

      - name: Upload ZIP to S3
        run: |
          aws s3 cp lambda.zip \
            s3://requirements-deploy/lambda-${{ github.sha }}.zip

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name feedback-analyzer \
            --s3-bucket requirements-deploy \
            --s3-key lambda-${{ github.sha }}.zip

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name feedback-analyzer

      - name: Verify deployment
        run: |
          aws lambda get-function-configuration \
            --function-name feedback-analyzer \
            --query '{Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus,CodeSize:CodeSize}' \
            --output json
